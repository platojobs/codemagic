name: iOS Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# 同一提交（sha）无论由 main 推送还是 tag 推送，只保留一次运行；
# 后到的运行会取消先到的运行，避免重复消耗 macOS runner 分钟数。
concurrency:
  group: ios-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode and show environment
        run: |
          for candidate in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version
          echo "Developer dir: $(xcode-select -p)"
          xcrun simctl list devices available | head -40

      - name: Build (generic iOS Simulator)
        run: |
          xcodebuild -project codemagic.xcodeproj \
            -scheme codemagic \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Unit tests (iPhone simulator)
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$SIM_UDID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "Using simulator: $SIM_UDID"
          xcodebuild -project codemagic.xcodeproj \
            -scheme codemagic \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ github.run_id }}
          path: .build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: warn

  e2e-contract:
    name: E2E contract (PJGoIoT fixture)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout iOS repo
        uses: actions/checkout@v7

      - name: Checkout PJGoIoT (backend fixture, pinned release tag)
        uses: actions/checkout@v7
        with:
          repository: platojobs/PJGoIoT
          path: PJGoIoT
          ref: v0.23.0
          persist-credentials: false

      - name: Set up Go (version from PJGoIoT/go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: PJGoIoT/go.mod
          cache-dependency-path: PJGoIoT/go.sum

      - name: Run e2e contract script
        env:
          PJGOIOT_DIR: ${{ github.workspace }}/PJGoIoT
        run: |
          go version
          swiftc --version
          bash scripts/e2e-contract.sh

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ github.run_id }}
          path: .build/e2e/
          if-no-files-found: warn
